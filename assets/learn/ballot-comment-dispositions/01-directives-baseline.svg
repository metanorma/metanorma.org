<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
  </defs>
  <style>
    .st { fill:#ffffff; stroke:#2e6e9e; stroke-width:1.5; }
    .code { font-size:13px; font-weight:bold; fill:#2e6e9e; text-anchor:middle; }
    .name { font-size:12px; font-weight:bold; fill:#1f2d3d; text-anchor:middle; }
    .req { font-size:11px; fill:#4a5a68; }
    .reqt { font-size:11px; fill:#4a5a68; }
    .h { font-size:14px; font-weight:bold; fill:#1f2d3d; }
    .foot { font-size:10.5px; fill:#6a7a88; }
    .ar { stroke:#5a6b7a; stroke-width:2; fill:none; }
  </style>

  <text class="h" x="30" y="42">The Directives baseline — what must happen (tool-agnostic)</text>
  <text class="foot" x="30" y="63">ISO/IEC Directives, Part 1 — Procedures for the technical work. Stage codes per the ISO harmonized stage-code table (iso.org/stage-codes.html).</text>

  <!-- stages -->
  <rect class="st" x="30"  y="90" width="200" height="150" rx="8"/>
  <text class="code" x="130" y="115">10 Proposal</text>
  <text class="name" x="130" y="135">New Work Item (NP/NWIP)</text>
  <text class="reqt" x="45" y="160">• P-member ballot, 3 months</text>
  <text class="reqt" x="45" y="176">• 10.20 ballot initiated</text>
  <text class="reqt" x="45" y="192">• 10.60 close of vote</text>
  <text class="reqt" x="45" y="208">• 10.99 project approved</text>

  <rect class="st" x="250" y="90" width="200" height="150" rx="8"/>
  <text class="code" x="350" y="115">20 Preparatory</text>
  <text class="name" x="350" y="135">AWI / Working Draft (WD)</text>
  <text class="reqt" x="265" y="160">• Project registered: 20.00</text>
  <text class="reqt" x="265" y="176">• WD study: 20.20</text>
  <text class="reqt" x="265" y="192">• WG consensus, no</text>
  <text class="reqt" x="265" y="208">  international ballot</text>

  <rect class="st" x="470" y="90" width="200" height="150" rx="8"/>
  <text class="code" x="570" y="115">30 Committee</text>
  <text class="name" x="570" y="135">Committee Draft (CD)</text>
  <text class="reqt" x="485" y="160">• Committee internal ballot,</text>
  <text class="reqt" x="485" y="176">  consensus required</text>
  <text class="reqt" x="485" y="192">• 30.99 CD approved for</text>
  <text class="reqt" x="485" y="208">  registration as DIS</text>

  <rect class="st" x="690" y="90" width="200" height="150" rx="8"/>
  <text class="code" x="790" y="115">40 Enquiry</text>
  <text class="name" x="790" y="135">DIS — Draft International Standard</text>
  <text class="reqt" x="705" y="160">• 40.00 DIS registered</text>
  <text class="reqt" x="705" y="176">• 40.20 ballot: 12 weeks,</text>
  <text class="reqt" x="705" y="192">  all national bodies vote</text>
  <text class="reqt" x="705" y="208">• 40.60 close · 40.92 report</text>

  <rect class="st" x="910" y="90" width="200" height="150" rx="8"/>
  <text class="code" x="1010" y="115">50 Approval</text>
  <text class="name" x="1010" y="135">FDIS — Final Draft</text>
  <text class="reqt" x="925" y="160">• Mandatory after technical</text>
  <text class="reqt" x="925" y="176">  changes at 40; may be</text>
  <text class="reqt" x="925" y="192">  skipped if DIS passed clean</text>
  <text class="reqt" x="925" y="208">• Yes/no vote, 2 months</text>

  <rect class="st" x="1130" y="90" width="80" height="150" rx="8"/>
  <text class="code" x="1170" y="115">60 Pub.</text>
  <text class="name" x="1170" y="135">IS</text>
  <text class="reqt" x="1142" y="160">• 60.00 proof</text>
  <text class="reqt" x="1142" y="176">• 60.60 published</text>

  <line class="ar" x1="230" y1="165" x2="248" y2="165" marker-end="url(#a)"/>
  <line class="ar" x1="450" y1="165" x2="468" y2="165" marker-end="url(#a)"/>
  <line class="ar" x1="670" y1="165" x2="688" y2="165" marker-end="url(#a)"/>
  <line class="ar" x1="890" y1="165" x2="908" y2="165" marker-end="url(#a)"/>
  <line class="ar" x1="1110" y1="165" x2="1128" y2="165" marker-end="url(#a)"/>

  <!-- disposition requirement band -->
  <rect x="30" y="270" width="1180" height="110" rx="8" fill="#f4f8fb" stroke="#d7e3ec"/>
  <text class="h" x="55" y="300">The disposition obligation — the sentence this workflow implements</text>
  <text class="reqt" x="55" y="325">After every ballot, the ballot report presents the vote results and all comments received; for each comment,</text>
  <text class="reqt" x="55" y="342">"the project editor shall record the disposition on which the meeting achieves consensus, or if that fails,</text>
  <text class="reqt" x="55" y="359">the proposition". (ISO/IEC Directives Part 1 + Supplements; wording per the consolidated editions.)</text>

  <!-- maintenance band -->
  <rect x="30" y="400" width="1180" height="100" rx="8" fill="#f4faf5" stroke="#d5e6d8"/>
  <text class="h" x="55" y="430">After publication — maintenance</text>
  <text class="reqt" x="55" y="455">• Systematic review at 60.60 + up to 5 years: confirm / amend / revise / withdraw (P-members vote).</text>
  <text class="reqt" x="55" y="472">• Amendments (Amd) and revisions re-enter the cycle at stage 10 or 20 (revision ≈ new edition).</text>

  <!-- footnote: editions -->
  <text class="foot" x="30" y="530">Editions note: stage codes are stable across editions (ISO harmonized stage codes). Clause numbering is not: the 2012 edition placed the stages in clause 2,</text>
  <text class="foot" x="30" y="546">the 2021 edition in clause 4, and the 2026 consolidated edition again renumbers them (systematic-review guidance cites clauses 2.3–2.8 for the revision path).</text>
  <text class="foot" x="30" y="556" >This document therefore cites stages by NAME + stage code, which are edition-stable.</text>
</svg>
