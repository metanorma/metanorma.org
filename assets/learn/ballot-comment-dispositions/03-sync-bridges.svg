<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6e9e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3e7d4e"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke-width:2; rx:10; }
    .t { font-size:16px; font-weight:bold; }
    .s { font-size:12px; fill:#4a5a68; }
    .item { font-size:11.5px; fill:#33475b; }
    .chip { fill:#eef2f6; stroke:#c9d4de; }
    .ct { font-size:10.5px; fill:#33475b; text-anchor:middle; }
    .b1 { stroke:#2e6e9e; stroke-width:2.5; fill:none; }
    .b2 { stroke:#3e7d4e; stroke-width:2.5; fill:none; stroke-dasharray:8 5; }
    .bl { font-size:12px; font-weight:bold; fill:#1f2d3d; }
    .bd { font-size:11px; fill:#4a5a68; }
    .num { fill:#ffffff; font-size:12px; font-weight:bold; text-anchor:middle; }
  </style>

  <!-- OSD ledger -->
  <rect class="box" x="40" y="60" width="420" height="560" stroke="#2e6e9e" fill="#f4f8fb"/>
  <text class="t" x="60" y="92" fill="#2e6e9e">OSD project ledger</text>
  <text class="s" x="60" y="114">ISO/IEC Online Standards Development</text>
  <text class="item" x="60" y="150">• Draft as structured NISO STS XML</text>
  <text class="item" x="60" y="172">• Online comments during NP/CD/DIS/FDIS</text>
  <text class="item" x="60" y="194">• Resolution status per comment</text>
  <text class="item" x="60" y="216">• Auto-collation of ISO-template comments</text>
  <text class="item" x="60" y="238">• e-Ballots (NP, DIS, FDIS)</text>
  <text class="item" x="60" y="260">• Exports: STS XML, comment exports (XLSX)</text>
  <text class="s" x="60" y="310" font-weight="bold">Formal role:</text>
  <text class="s" x="60" y="330">carries the ballot of record when the</text>
  <text class="s" x="60" y="350">project runs in OSD.</text>

  <!-- Git ledger -->
  <rect class="box" x="780" y="60" width="420" height="560" stroke="#3e7d4e" fill="#f4faf5"/>
  <text class="t" x="800" y="92" fill="#3e7d4e">Git repository ledger</text>
  <text class="s" x="800" y="114">metanorma/iso-iec-80000 (+ commenter YAML)</text>
  <text class="item" x="800" y="150">• Metanorma AsciiDoc source + dataset blocks</text>
  <text class="item" x="800" y="172">• One comment = one GitHub issue</text>
  <text class="item" x="800" y="194">• One disposition = one commit + issue comment</text>
  <text class="item" x="800" y="216">• CI renders PDF / DOC / ISO STS XML</text>
  <text class="item" x="800" y="238">• Published editions frozen; drafts per stage</text>
  <text class="item" x="800" y="260">• Disposition sheets generated by export</text>
  <text class="s" x="800" y="310" font-weight="bold">Formal role:</text>
  <text class="s" x="800" y="330">the ledger of record for the exempted</text>
  <text class="s" x="800" y="350">project; produces the STS that ISO CS needs.</text>

  <!-- Bridge B1: STS both ways -->
  <line class="b1" x1="460" y1="200" x2="780" y2="170" marker-end="url(#a)"/>
  <line class="b1" x1="780" y1="210" x2="460" y2="240" marker-end="url(#b)"/>
  <rect x="480" y="130" width="280" height="86" rx="8" fill="#ffffff" stroke="#2e6e9e"/>
  <circle cx="500" cy="152" r="11" fill="#2e6e9e"/><text class="num" x="500" y="156">1</text>
  <text class="bl" x="520" y="156">STS bridge (document)</text>
  <text class="bd" x="500" y="176">Git → OSD: Metanorma STS output imported</text>
  <text class="bd" x="500" y="192">OSD → Git: STS export → mnconvert → source</text>

  <!-- Bridge B2: comments into Git -->
  <line class="b1" x1="460" y1="420" x2="780" y2="400" marker-end="url(#a)"/>
  <rect x="480" y="350" width="280" height="100" rx="8" fill="#ffffff" stroke="#2e6e9e"/>
  <circle cx="500" cy="372" r="11" fill="#2e6e9e"/><text class="num" x="500" y="376">2</text>
  <text class="bl" x="520" y="376">Comments bridge (OSD → Git)</text>
  <text class="bd" x="500" y="396">OSD comment export (XLSX) → commenter</text>
  <text class="bd" x="500" y="412">import → issues. Today: XLSX import exists;</text>
  <text class="bd" x="500" y="428">direct API upload is the convergence target.</text>

  <!-- Bridge B3: dispositions into OSD -->
  <line class="b2" x1="780" y1="470" x2="460" y2="490" marker-end="url(#b)"/>
  <rect x="480" y="470" width="280" height="100" rx="8" fill="#ffffff" stroke="#3e7d4e"/>
  <circle cx="500" cy="492" r="11" fill="#3e7d4e"/><text class="num" x="500" y="496">3</text>
  <text class="bl" x="520" y="496">Dispositions bridge (Git → OSD)</text>
  <text class="bd" x="500" y="516">commenter YAML observations → ISO comment</text>
  <text class="bd" x="500" y="532">template (filler) → OSD collation / resolution;</text>
  <text class="bd" x="500" y="548">keeps resolution status consistent in both.</text>

  <!-- Bridge B4: events -->
  <line class="b2" x1="460" y1="560" x2="780" y2="560" marker-end="url(#b)"/>
  <rect x="480" y="585" width="280" height="70" rx="8" fill="#ffffff" stroke="#3e7d4e"/>
  <circle cx="500" cy="607" r="11" fill="#3e7d4e"/><text class="num" x="500" y="611">4</text>
  <text class="bl" x="520" y="611">Milestones bridge</text>
  <text class="bd" x="500" y="631">Ballot opens/closes, stage codes (10.99, 40.20,</text>
  <text class="bd" x="500" y="645">50.20, 60.60) mirrored as GitHub milestones.</text>

  <!-- caption -->
  <text x="40" y="680" font-size="12.5" fill="#1f2d3d" font-weight="bold">Rule of the ledger: at any moment exactly one lane is the ledger of record; the bridges above move the delta across.</text>
  <text x="40" y="700" font-size="11.5" fill="#4a5a68">A bridge crossing always produces a validation artifact (rendered document, validated YAML, or generated sheet) before the other ledger is updated.</text>
  <text x="40" y="720" font-size="11.5" fill="#4a5a68">Bridges 1 and 2 exist today; bridge 3 is semi-automated (commenter filler produces the ISO sheet that OSD collates); bridge 4 is procedural.</text>
</svg>
